name: update hashes on renovate prs

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - home/claude/package.nix
      - home/hunk/package.nix
      - home/pi/package.nix
      - home/codex/package.nix
      - home/litra-autotoggle/package.nix

jobs:
  update-hashes:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch cachix.yml for the hash commit
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: get changed files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: update claude hashes
        if: contains(steps.changed.outputs.files, 'home/claude/package.nix')
        run: |
          VERSION=$(grep 'version = ' home/claude/package.nix | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          bash home/claude/update-hashes.sh "$VERSION"

      - name: update pi hashes
        if: contains(steps.changed.outputs.files, 'home/pi/package.nix')
        run: |
          VERSION=$(grep 'version = ' home/pi/package.nix | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          bash home/pi/update-hashes.sh "$VERSION"

      - name: update hunk hashes
        if: contains(steps.changed.outputs.files, 'home/hunk/package.nix')
        run: |
          VERSION=$(grep 'version = ' home/hunk/package.nix | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          bash home/hunk/update-hashes.sh "$VERSION"

      - name: update codex hashes
        if: contains(steps.changed.outputs.files, 'home/codex/package.nix')
        run: |
          VERSION=$(grep 'version = ' home/codex/package.nix | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          bash home/codex/update-hashes.sh "$VERSION"

      - name: update litra-autotoggle hash
        if: contains(steps.changed.outputs.files, 'home/litra-autotoggle/package.nix')
        run: |
          VERSION=$(grep 'version = ' home/litra-autotoggle/package.nix | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          bash home/litra-autotoggle/update-hashes.sh "$VERSION"

      - name: commit and push updated hashes
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add home/claude/package.nix home/hunk/package.nix home/pi/package.nix home/codex/package.nix home/litra-autotoggle/package.nix
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update hashes"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN triggers no workflows, so the PR's head
      # commit would merge unbuilt. workflow_dispatch is the documented exception.
      - name: build the hash commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cachix.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_HEAD_REF"
