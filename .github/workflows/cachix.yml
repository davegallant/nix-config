name: "Build and push to cachix"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix fmt -- --check .
      - run: nix develop -c deadnix --fail .
      - run: nix develop -c statix check .
      - run: nix develop -c shellcheck $(git ls-files '*.sh')

  build-darwin:
    runs-on: macos-latest
    strategy:
      matrix:
        host:
          - helios
          - kratos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: davegallant
          authToken: "${{ secrets.CACHIX_API_KEY }}"
      - run: nix build .#darwinConfigurations.${{ matrix.host }}.config.system.build.toplevel --json | jq -r '.[].outputs | to_entries[].value' | cachix push davegallant

  build-hephaestus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: davegallant
          authToken: "${{ secrets.CACHIX_API_KEY }}"
      - run: nix build .#nixosConfigurations.hephaestus.config.system.build.toplevel --json | jq -r '.[].outputs | to_entries[].value' | cachix push davegallant
