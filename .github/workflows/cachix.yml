name: "Build and push to cachix"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix fmt -- --check .
      - run: nix develop -c deadnix --fail .
      - run: nix develop -c statix check .
      - run: git ls-files -z '*.sh' | nix develop -c xargs -0 shellcheck

  build-darwin:
    runs-on: macos-latest
    strategy:
      matrix:
        host:
          - helios
          - kratos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: davegallant
          skipPush: true
      - name: Build system
        run: nix build .#darwinConfigurations.${{ matrix.host }}.config.system.build.toplevel --json > build-result.json
      - name: Push system to Cachix
        if: github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_API_KEY }}"
        run: jq -r '.[].outputs | to_entries[].value' build-result.json | cachix push davegallant

  build-hephaestus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: davegallant
          skipPush: true
      - name: Build system
        run: nix build .#nixosConfigurations.hephaestus.config.system.build.toplevel --json > build-result.json
      - name: Push system to Cachix
        if: github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_API_KEY }}"
        run: jq -r '.[].outputs | to_entries[].value' build-result.json | cachix push davegallant
