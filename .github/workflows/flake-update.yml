name: flake-update

on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/update-flake-lock@0281a39e4c38fabb75c9d1377e541666db300909 # main
        with:
          pr-title: "chore: flake.lock update"
          pr-labels: |
            dependencies
            automated
          commit-msg: "chore: flake.lock update"
